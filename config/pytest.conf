[pytest]
log_file=logs/test.log
log_file_level=INFO
log_file_format=%(asctime)s %(levelname)s %(message)s
log_file_date_format=%Y-%m-%d %H:%M:%S

addopts = -p no:faulthandler

# selenium 3.141 的 resp.getheader() 在 urllib3 v1.26+ 已废弃：每次 Appium HTTP 命令都会触发一次
# DeprecationWarning，一条用例几十条重复刷屏 warnings summary 并污染平台日志。
# 精确忽略该模块这一条废弃告警（其他警告不受影响）。
filterwarnings =
    ignore:HTTPResponse\.getheader\(\) is deprecated.*:DeprecationWarning:selenium\.webdriver\.remote\.remote_connection

markers=
    search_kw: 搜索关键字(demoProject的marker)
