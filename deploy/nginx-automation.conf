# nginx 反代样例：团队通过 http://<服务器IP>/ 访问平台，/locator/ 访问元素定位器
# 放置到 /etc/nginx/sites-available/automation 并软链到 sites-enabled，然后 nginx -s reload
# 建议同时开启 basic auth（内网也可按需省略）:
#   htpasswd -c /etc/nginx/.htpasswd teamuser
server {
    listen 80;
    server_name _;

    # basic auth（按需启用）
    # auth_basic "AutomationTest";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # 测试平台
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }

    # 元素定位器（前端资源路径为根相对，需重写）
    location /locator/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
