<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <radialGradient id="sun3" cx="40%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="50%" stop-color="#ffd97a"/>
      <stop offset="100%" stop-color="#f0a94e"/>
    </radialGradient>
    <radialGradient id="moon3" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fbf8ea"/>
      <stop offset="60%" stop-color="#eee7c4"/>
      <stop offset="100%" stop-color="#d5cba0"/>
    </radialGradient>
    <linearGradient id="leaf3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbf6e"/>
      <stop offset="100%" stop-color="#5d9448"/>
    </linearGradient>
    <filter id="soft3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <mask id="bite3">
      <rect x="-160" y="-160" width="320" height="320" fill="#fff"/>
      <circle cx="32" cy="-28" r="61" fill="#000"/>
    </mask>
  </defs>

  <!-- ============ 日：叶影暖阳（自然治愈系） ============ -->
  <g transform="translate(150,150)">
    <!-- 花瓣状暖光 -->
    <g fill="#f6c268" opacity=".8">
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(52)"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(104)"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(156)"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(208)"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(260)"/>
      <path d="M 0 -100 C 14 -118 34 -114 36 -96 C 38 -80 20 -74 0 -78 Z" transform="rotate(312)"/>
    </g>
    <circle r="70" fill="url(#sun3)" stroke="#e2a24a" stroke-width="3" stroke-opacity=".5"/>
    <!-- 顶部新芽：自然治愈的小叶子 -->
    <g transform="translate(0,-64)">
      <path d="M 0 16 Q -3 -6 0 -22" fill="none" stroke="#5d9448" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 -8 Q -20 -14 -26 -32 Q -6 -34 0 -8 Z" fill="url(#leaf3)"/>
      <path d="M 0 -8 Q 20 -14 26 -32 Q 6 -34 0 -8 Z" fill="url(#leaf3)" opacity=".85"/>
    </g>
    <!-- 温暖弧光 -->
    <path d="M -36 -12 Q -22 -30 0 -34" fill="none" stroke="#fff5d8" stroke-width="8"
          stroke-linecap="round" opacity=".85"/>
    <path d="M -32 26 Q -6 42 22 30" fill="none" stroke="#eeab52" stroke-width="5"
          stroke-linecap="round" opacity=".55"/>
    <!-- 环绕的小飞虫/光点 -->
    <g fill="#fff2c8" opacity=".9">
      <circle cx="58" cy="-46" r="4"/>
      <circle cx="66" cy="22" r="3.2" opacity=".8"/>
      <circle cx="-60" cy="-30" r="3.4" opacity=".8"/>
    </g>
  </g>

  <!-- ============ 月：萤火月牙（夜之森林） ============ -->
  <g transform="translate(450,150)">
    <g mask="url(#bite3)">
      <circle r="72" fill="url(#moon3)" stroke="#c9bc8d" stroke-width="3" stroke-opacity=".5"/>
      <circle cx="-24" cy="-16" r="10" fill="#cfc294" opacity=".7"/>
      <circle cx="-6" cy="26" r="6.4" fill="#cfc294" opacity=".6"/>
      <path d="M 36 -42 Q 60 0 36 44" fill="none" stroke="#fdf9e8" stroke-width="9"
            stroke-linecap="round" opacity=".9"/>
    </g>
    <!-- 月牙怀里的小叶子 -->
    <g transform="translate(38,26) rotate(18)">
      <path d="M 0 12 Q -2 -4 0 -16" fill="none" stroke="#5d9448" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M 0 -6 Q -15 -11 -20 -26 Q -4 -27 0 -6 Z" fill="url(#leaf3)"/>
      <path d="M 0 -6 Q 15 -11 20 -26 Q 4 -27 0 -6 Z" fill="url(#leaf3)" opacity=".85"/>
    </g>
    <!-- 萤火虫光点：暖绿黄光、大小明灭感 -->
    <g>
      <circle cx="52" cy="-52" r="5" fill="#f4e88a" opacity=".95"/>
      <circle cx="52" cy="-52" r="10" fill="#f4e88a" opacity=".25" filter="url(#soft3)"/>
      <circle cx="78" cy="-14" r="3.6" fill="#eaf2b0" opacity=".85"/>
      <circle cx="78" cy="-14" r="8" fill="#eaf2b0" opacity=".2" filter="url(#soft3)"/>
      <circle cx="62" cy="44" r="4.2" fill="#f4e88a" opacity=".9"/>
      <circle cx="62" cy="44" r="9" fill="#f4e88a" opacity=".22" filter="url(#soft3)"/>
      <circle cx="20" cy="-76" r="3" fill="#eaf2b0" opacity=".75"/>
      <circle cx="88" cy="18" r="2.8" fill="#eaf2b0" opacity=".7"/>
    </g>
    <!-- 夜风细云 -->
    <g fill="#eef2f8" opacity=".8">
      <ellipse cx="0" cy="66" rx="40" ry="11"/>
      <ellipse cx="30" cy="58" rx="24" ry="9"/>
    </g>
  </g>
</svg>
