<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · AppUI 自动化测试平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="admin">
<div class="sidebar" id="sidebar"></div>
<main>
  <div class="pagehead">
    <h1>🗂 管理后台</h1>
    <span class="sub" id="subTitle">上传用例 / 元素 / 页面对象，平台自动识别（上传即生效）</span>
  </div>

  <div class="card" id="authCard" style="display:none">
    <h3>🔐 访问口令</h3>
    <p class="muted">服务端已启用口令保护（环境变量 ADMIN_TOKEN），请输入团队口令：</p>
    <div class="mt" style="display:flex;gap:8px;max-width:420px">
      <input type="password" id="inToken" style="flex:1;background:var(--dark);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px">
      <button id="btnToken">保存</button>
    </div>
  </div>

  <div class="card">
    <h3>⬆ 上传文件</h3>
    <div class="fields">
      <div class="field"><label>类型</label>
        <select id="upKind">
          <option value="cases">测试用例（cases/，文件名 test_*.py）</option>
          <option value="elements">元素仓库（xxxElements.py）</option>
          <option value="pages">页面对象（xxxPage.py）</option>
        </select>
      </div>
      <div class="field"><label>子目录（仅用例可填，如 demoProject/api，留空=根）</label>
        <input type="text" id="upSubdir" placeholder="demoProject/api">
      </div>
    </div>
    <div class="mt" style="display:flex;gap:10px;align-items:center">
      <input type="file" id="upFile" accept=".py" style="color:var(--ink2)">
      <label class="muted"><input type="checkbox" id="upForce"> 覆盖同名文件</label>
      <button id="btnUpload">⬆ 上传</button>
    </div>
    <p class="muted mt" style="font-size:12px">上传前自动做语法校验（py_compile）；.py 且 ≤200KB；用例文件名必须 test_ 开头。</p>
  </div>

  <div class="card">
    <div class="cardhead"><h3>📄 文件列表 <span class="muted" id="fileCount"></span>
      <select id="listKind" style="margin-left:10px;background:var(--dark);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px">
        <option value="cases">测试用例</option>
        <option value="elements">元素仓库</option>
        <option value="pages">页面对象</option>
      </select></h3></div>
    <div class="tblwrap">
      <table>
        <thead><tr><th>文件（相对目录）</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead>
        <tbody id="fileList"></tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h4 id="mTitle"></h4>
    <p id="mMsg"></p>
    <div class="mops"><button class="ghost" id="mCancel">取消</button><button id="mOk">确定</button></div>
  </div>
</div>
<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
