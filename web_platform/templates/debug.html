<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查 · AppUI 自动化测试平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="debug">
<div class="sidebar" id="sidebar"></div>
<main>
  <div class="pagehead">
    <h1>🧪 代码审查</h1>
    <span class="sub" id="subTitle">框架接口 / 方法调用逐项调试与验证（按文件分类）</span>
    <div class="actions">
      <button class="ghost" id="btnReload">⟳ 刷新清单</button>
      <button id="btnRunAll">▶ 全部验证</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat s-blue"><span class="bgico">📦</span><div class="num" id="stTotal">—</div><div class="label">调试项 / 文件</div></div>
    <div class="stat s-green"><span class="bgico">✅</span><div class="num" id="stPass">—</div><div class="label">通过</div></div>
    <div class="stat s-red"><span class="bgico">❌</span><div class="num" id="stFail">—</div><div class="label">失败 / 异常</div></div>
    <div class="stat s-slate"><span class="bgico">⏭</span><div class="num" id="stSkip">—</div><div class="label">跳过（环境未就绪）</div></div>
  </div>

  <div id="dbgList"><div class="card"><h3>加载中…</h3></div></div>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
<script src="/static/debug.js"></script>
</body>
</html>
