<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码审查 · AppUI 自动化测试平台</title>
<meta name="color-scheme" content="dark">
<script>try { if (localStorage.getItem('platform_theme') === 'day') document.documentElement.classList.add('day'); } catch (e) {}</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="debug">
<div class="sidebar" id="sidebar"></div>
<main>
  <div class="pagehead">
    <h1>🧪 代码审查</h1>
    <span class="sub" id="subTitle">框架体检 · 按模块分组 · 点统计卡筛选 · 每次全部验证自动存记录</span>
    <div class="actions">
      <button class="ghost" id="btnReload">⟳ 刷新清单</button>
      <button id="btnRunAll">▶ 全部验证</button>
    </div>
  </div>

  <div class="toptabs">
    <button class="ttab on" data-view="overview">📋 模块总览</button>
    <button class="ttab" data-view="records">🗂 审查记录</button>
  </div>

  <div id="viewBanner" class="card viewbanner" style="display:none"></div>

  <section id="view-overview">
    <div class="stats">
      <div class="stat s-blue"><span class="bgico">📦</span><div class="num" id="stTotal">—</div><div class="label">调试项 / 模块</div></div>
      <div class="stat s-green clickable" title="点击只看「通过」项，再点一次取消"><span class="bgico">✅</span><div class="num" id="stPass">—</div><div class="label">通过 ▾筛选</div></div>
      <div class="stat s-red clickable" title="点击只看「失败/异常」项，再点一次取消"><span class="bgico">❌</span><div class="num" id="stFail">—</div><div class="label">失败 / 异常 ▾筛选</div></div>
      <div class="stat s-slate clickable" title="点击只看「跳过」项，再点一次取消"><span class="bgico">⏭</span><div class="num" id="stSkip">—</div><div class="label">跳过 ▾筛选</div></div>
    </div>
    <p class="muted" id="filterTip" style="display:none;margin:-6px 0 12px">当前筛选：<b id="filterTipText"></b>（再点同一统计卡取消筛选）</p>
    <div class="card healthline" id="healthLine"></div>
    <div id="fileChips" class="chips"></div>
    <div id="dbgList"><div class="card"><h3>加载中…</h3></div></div>
  </section>

  <section id="view-records" style="display:none">
    <div class="card">
      <div class="cardhead"><h3>🗂 代码审查记录 <span class="muted" id="recCount"></span></h3></div>
      <div class="tblwrap">
        <table>
          <thead><tr><th>记录 ID</th><th>时间</th><th>结果</th><th>总耗时</th><th>操作</th></tr></thead>
          <tbody id="recList"></tbody>
        </table>
      </div>
      <div class="pager" id="recPager"></div>
    </div>
  </section>
</main>
<div id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h4 id="mTitle"></h4>
    <p id="mMsg"></p>
    <div class="mops"><button class="ghost" id="mCancel">取消</button><button id="mOk">确定</button></div>
  </div>
</div>
<script src="/static/theme.js"></script>
<script src="/static/app.js"></script>
<script src="/static/debug.js"></script>
</body>
</html>
