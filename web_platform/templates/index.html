<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · AppUI 自动化测试平台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="index">
<div class="sidebar" id="sidebar"></div>
<main>
  <div class="pagehead">
    <h1>📊 执行总览</h1>
    <span class="sub">今日平台的执行统计与最近记录</span>
    <div class="actions"><button class="danger" id="btnClearAll">🗑 清空全部记录</button></div>
  </div>

  <div class="stats">
    <div class="stat s-blue"><span class="bgico">🧪</span><div class="num" id="cardRuns">—</div><div class="label">总执行次数</div></div>
    <div class="stat s-green"><span class="bgico">✅</span><div class="num" id="cardPass">—</div><div class="label">通过</div></div>
    <div class="stat s-red"><span class="bgico">❌</span><div class="num" id="cardFail">—</div><div class="label">失败 / 异常</div></div>
    <div class="stat s-slate"><span class="bgico">🎯</span><div class="num" id="cardRate">—</div><div class="label">成功率</div></div>
  </div>

  <div class="card">
    <h3>最近执行</h3>
    <div class="tblwrap">
      <table>
        <thead><tr><th>Run ID</th><th>开始时间</th><th>设备</th><th>App</th><th>共/过/失</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="recentList"></tbody>
      </table>
    </div>
  </div>
</main>
<div id="toast"></div>
<div class="mask" id="mask">
  <div class="modal">
    <h4 id="mTitle"></h4>
    <p id="mMsg"></p>
    <div class="mops"><button class="ghost" id="mCancel">取消</button><button id="mOk">确定</button></div>
  </div>
</div>
<script src="/static/theme.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
